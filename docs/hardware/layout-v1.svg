<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
    <pattern id="coil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f3e2c4"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b8732a" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1040" height="960" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold">Анализатор тримикса — компоновка v1 (внутр. 230 × 125 × 55 мм)</text>
  <text x="20" y="46" fill="#555">Масштаб 4 px/мм. Сплошное — на основании, пунктир — на крышке. Оранжевое — газовый тракт.</text>

  <!-- ===== TOP VIEW: origin at (60, 70), 230x125 mm -> 920x500 px; Y up -->
  <g transform="translate(60,70)">
    <text x="0" y="-8" font-size="13" font-weight="bold">Вид сверху (крышка снята)</text>
    <rect x="0" y="0" width="920" height="500" fill="#fafafa" stroke="#222" stroke-width="2"/>

    <!-- grid labels X -->
    <g fill="#888" font-size="9">
      <text x="-4" y="512">0</text><text x="96" y="512">25</text><text x="196" y="512">50</text><text x="296" y="512">75</text>
      <text x="392" y="512">100</text><text x="492" y="512">125</text><text x="592" y="512">150</text><text x="692" y="512">175</text>
      <text x="792" y="512">200</text><text x="906" y="512">230</text>
      <text x="-22" y="504">0</text><text x="-26" y="328">44</text><text x="-26" y="312">48</text><text x="-26" y="152">88</text><text x="-26" y="136">92</text><text x="-30" y="6">125</text>
    </g>
    <!-- row separators -->
    <line x1="0" y1="148" x2="920" y2="148" stroke="#bbb" stroke-dasharray="4 4"/>
    <line x1="0" y1="324" x2="920" y2="324" stroke="#bbb" stroke-dasharray="4 4"/>
    <text x="928" y="80" fill="#888" font-size="10">задний</text><text x="928" y="92" fill="#888" font-size="10">ряд</text>
    <text x="928" y="236" fill="#888" font-size="10">средний</text><text x="928" y="248" fill="#888" font-size="10">ряд</text>
    <text x="928" y="404" fill="#888" font-size="10">передний</text><text x="928" y="416" fill="#888" font-size="10">ряд</text>

    <!-- P-clips under tube (X 70, 150), drawn first so tube sits on top -->
    <rect x="272" y="40" width="16" height="104" fill="#777" rx="2"/>
    <rect x="592" y="40" width="16" height="104" fill="#777" rx="2"/>

    <!-- coil X 25-60, dia 33 -> Y 91.5..124.5 -->
    <rect x="100" y="2" width="140" height="132" fill="url(#coil)" stroke="#b8732a" stroke-width="1.5" rx="6"/>
    <!-- tube X 17-197, dia 25 -> Y 95.5..120.5  => svg y = (125-120.5)*4=18 .. (125-95.5)*4=118 -->
    <rect x="68" y="18" width="720" height="100" fill="#dfe6ee" stroke="#2b3f55" stroke-width="2"/>
    <line x1="68" y1="68" x2="788" y2="68" stroke="#2b3f55" stroke-dasharray="8 4" stroke-width="1"/>
    <text x="330" y="63" font-size="12" font-weight="bold" fill="#2b3f55">трубка Al Ø25 × 180, L_ак = 150</text>
    <text x="330" y="80" font-size="10" fill="#2b3f55">ось Y = 108, Z = 24</text>
    <text x="104" y="63" font-size="10" fill="#7a4a12" font-weight="bold">змеевик</text>
    <text x="104" y="76" font-size="9" fill="#7a4a12">Cu Ø4 × 50 см</text>
    <!-- flanges A: X 10-17 dia 30 -> Y 93..123 => y 8..128 ; B: X 197-204 -->
    <rect x="40" y="8" width="28" height="120" fill="#c9d3dd" stroke="#2b3f55" stroke-width="2"/>
    <rect x="788" y="8" width="28" height="120" fill="#c9d3dd" stroke="#2b3f55" stroke-width="2"/>
    <text x="46" y="72" font-size="11" font-weight="bold">A</text>
    <text x="796" y="72" font-size="11" font-weight="bold">B</text>
    <!-- speaker in A, mic in B -->
    <text x="72" y="32" font-size="9" fill="#2b3f55">динамик Ø20</text>
    <text x="712" y="32" font-size="9" fill="#2b3f55">мик · TMP117</text>
    <!-- radial ports (down) -->
    <rect x="50" y="128" width="8" height="14" fill="#555"/>
    <rect x="798" y="128" width="8" height="14" fill="#555"/>
    <text x="8" y="142" font-size="9">порт A</text>
    <text x="808" y="142" font-size="9">порт B</text>
    <text x="262" y="146" font-size="8" fill="#444">P-скоба</text>
    <text x="582" y="146" font-size="8" fill="#444">P-скоба</text>

    <!-- middle row -->
    <!-- power zone X 10-60, Y 48-88 -> y 148..308 -->
    <rect x="40" y="148" width="200" height="160" fill="#fde8e8" stroke="#a33" stroke-width="1.5"/>
    <text x="50" y="168" font-weight="bold" fill="#a33">ПИТАНИЕ</text>
    <text x="50" y="186" fill="#a33">TP4056 · boost 5.2 V</text>
    <text x="50" y="202" fill="#a33">AMS1117-3.3 · SW1</text>
    <text x="50" y="222" font-size="9" fill="#a33">(горячее — подальше</text>
    <text x="50" y="234" font-size="9" fill="#a33">от торца B с TMP117)</text>
    <!-- ZE07 cap X 70-110, Y 48-83 -> y 168..308 -->
    <rect x="280" y="168" width="160" height="140" fill="#e8f0e8" stroke="#3a6" stroke-width="1.5" rx="4"/>
    <text x="300" y="230" font-weight="bold" fill="#285">колпак ZE07-CO</text>
    <text x="300" y="246" fill="#285">40 × 35, диффуз.</text>
    <!-- SCD30 cap X 115-155, Y 50-80 -> y 180..300 -->
    <rect x="460" y="180" width="160" height="120" fill="#e8f0e8" stroke="#3a6" stroke-width="1.5" rx="4"/>
    <text x="480" y="236" font-weight="bold" fill="#285">колпак SCD30</text>
    <text x="480" y="252" fill="#285">40 × 30</text>
    <!-- O2 chamber X 160-225, Y 50-86 (dia 36) -> y 156..300 -->
    <rect x="640" y="156" width="260" height="144" fill="#e8f0e8" stroke="#3a6" stroke-width="1.5" rx="40"/>
    <text x="700" y="218" font-weight="bold" fill="#285">камера O2-ячейки</text>
    <text x="700" y="234" fill="#285">Ø36 × 65, горизонт.</text>
    <text x="700" y="250" fill="#285">+ BMP390 внутри</text>

    <!-- front row -->
    <!-- battery X 5-85, Y 10-31 -> y 376..460 -->
    <rect x="20" y="376" width="320" height="84" fill="#eee8ff" stroke="#639" stroke-width="1.5" rx="20"/>
    <text x="120" y="412" font-weight="bold" fill="#639">18650</text>
    <text x="120" y="428" fill="#639">холдер 78 × 21</text>
    <!-- devkit X 92-157, Y 6-32 -> y 372..476 -->
    <rect x="368" y="372" width="260" height="104" fill="#e4eefc" stroke="#246" stroke-width="1.5"/>
    <text x="392" y="412" font-weight="bold" fill="#246">ESP32-C5-DevKitC-1</text>
    <text x="392" y="428" fill="#246">65 × 26</text>
    <rect x="486" y="476" width="24" height="10" fill="#246"/>
    <text x="446" y="498" font-size="9" fill="#246">USB-C → окно в передней стенке</text>
    <!-- perfboard X 165-225, Y 4-44 -> y 324..484 -->
    <rect x="660" y="324" width="240" height="160" fill="#fff6dc" stroke="#a80" stroke-width="1.5"/>
    <text x="676" y="346" font-weight="bold" fill="#860">перфоплата 60 × 40</text>
    <text x="676" y="362" fill="#860">ADS1115 · MAX17048</text>
    <text x="676" y="378" fill="#860">MAX98357A · обвязка</text>
    <text x="676" y="394" fill="#860">JST-PH под жгуты</text>

    <!-- lid items (dashed) -->
    <rect x="384" y="340" width="172" height="124" fill="none" stroke="#246" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="396" y="356" font-size="10" fill="#246">дисплей 1.69" (на крышке)</text>
    <circle cx="680" cy="452" r="24" fill="none" stroke="#860" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="780" cy="452" r="24" fill="none" stroke="#860" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="880" cy="452" r="24" fill="none" stroke="#860" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="676" y="456" font-size="11" fill="#860">A</text><text x="776" y="456" font-size="11" fill="#860">B</text><text x="876" y="456" font-size="11" fill="#860">C</text>
    <text x="700" y="420" font-size="9" fill="#860">кнопки Ø12 (на крышке)</text>

    <!-- left wall items -->
    <rect x="-10" y="60" width="10" height="16" fill="#d9480f"/>
    <text x="-58" y="72" font-size="9" fill="#d9480f">ВХОД</text>
    <rect x="-10" y="316" width="10" height="16" fill="#d9480f"/>
    <text x="-68" y="328" font-size="9" fill="#d9480f">ВЫХЛОП</text>
    <rect x="-10" y="374" width="10" height="12" fill="#333"/>
    <text x="-58" y="384" font-size="9">USB-C зар.</text>
    <rect x="-10" y="434" width="10" height="12" fill="#333"/>
    <text x="-40" y="444" font-size="9">SW1</text>

    <!-- gas path -->
    <g fill="none" stroke="#d9480f" stroke-width="3" marker-end="url(#arr)" opacity="0.9">
      <path d="M0,68 L100,68"/>
      <path d="M240,110 Q250,140 150,140 L58,140"/>
      <path d="M806,142 L806,160 L770,160"/>
      <path d="M640,230 L620,230"/>
      <path d="M460,236 L440,236"/>
      <path d="M300,308 L300,324 L0,324"/>
    </g>
    <!-- inside tube arrow (A -> B) -->
    <path d="M90,100 L770,100" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arr)" opacity="0.8"/>
  </g>

  <!-- ===== SIDE VIEW: origin (60, 640), 230x55 mm -> 920x220 px; Z up -->
  <g transform="translate(60,640)">
    <text x="0" y="-8" font-size="13" font-weight="bold">Вид сбоку, сечение по оси трубки (Y = 108)</text>
    <rect x="0" y="0" width="920" height="220" fill="#fafafa" stroke="#222" stroke-width="2"/>
    <line x1="0" y1="0" x2="920" y2="0" stroke="#222" stroke-width="4"/>
    <text x="860" y="-4" font-size="9" fill="#555">крышка Z=55</text>
    <g fill="#888" font-size="9"><text x="-22" y="224">0</text><text x="-26" y="128">24</text><text x="-26" y="6">55</text></g>
    <!-- axis Z=24 -> y = (55-24)*4 = 124 -->
    <!-- P-clips: X 70,150 width 16 mm? draw 4mm wide pads from floor to tube bottom -->
    <rect x="272" y="190" width="16" height="30" fill="#777"/>
    <rect x="592" y="190" width="16" height="30" fill="#777"/>
    <rect x="268" y="206" width="24" height="14" fill="#333" rx="3"/>
    <rect x="588" y="206" width="24" height="14" fill="#333" rx="3"/>
    <text x="300" y="214" font-size="9">P-скоба + резиновая втулка</text>
    <!-- coil dia 33 -> y 58..190 -->
    <rect x="100" y="58" width="140" height="132" fill="url(#coil)" stroke="#b8732a" stroke-width="1.5" rx="6"/>
    <!-- tube dia 25 -> y 74..174 -->
    <rect x="68" y="74" width="720" height="100" fill="#dfe6ee" stroke="#2b3f55" stroke-width="2"/>
    <line x1="68" y1="124" x2="788" y2="124" stroke="#2b3f55" stroke-dasharray="8 4"/>
    <text x="330" y="120" font-size="12" font-weight="bold" fill="#2b3f55">трубка Ø25 (+ змеевик → Ø33)</text>
    <!-- flanges dia 30 -> y 64..184 -->
    <rect x="40" y="64" width="28" height="120" fill="#c9d3dd" stroke="#2b3f55" stroke-width="2"/>
    <rect x="788" y="64" width="28" height="120" fill="#c9d3dd" stroke="#2b3f55" stroke-width="2"/>
    <text x="46" y="128" font-size="11" font-weight="bold">A</text>
    <text x="796" y="128" font-size="11" font-weight="bold">B</text>
    <!-- radial ports pointing toward viewer: draw as circles -->
    <circle cx="54" cy="124" r="6" fill="#555"/><circle cx="802" cy="124" r="6" fill="#555"/>
    <text x="820" y="128" font-size="9">порт (радиально, на зрителя)</text>
    <!-- dimension: gap to lid -->
    <line x1="500" y1="2" x2="500" y2="56" stroke="#a33" stroke-width="1" marker-end="url(#arr)"/>
    <text x="506" y="34" font-size="9" fill="#a33">14 мм</text>
    <line x1="500" y1="190" x2="500" y2="218" stroke="#a33" stroke-width="1" marker-end="url(#arr)"/>
    <text x="506" y="208" font-size="9" fill="#a33">7.5</text>
  </g>

  <!-- legend -->
  <g transform="translate(60,890)" font-size="10">
    <rect x="0" y="0" width="14" height="10" fill="#dfe6ee" stroke="#2b3f55"/><text x="20" y="9">ячейка</text>
    <rect x="80" y="0" width="14" height="10" fill="url(#coil)" stroke="#b8732a"/><text x="100" y="9">змеевик</text>
    <rect x="170" y="0" width="14" height="10" fill="#e8f0e8" stroke="#3a6"/><text x="190" y="9">датчики в тракте</text>
    <rect x="300" y="0" width="14" height="10" fill="#fde8e8" stroke="#a33"/><text x="320" y="9">питание (тепло)</text>
    <rect x="420" y="0" width="14" height="10" fill="#e4eefc" stroke="#246"/><text x="440" y="9">MCU</text>
    <rect x="490" y="0" width="14" height="10" fill="#fff6dc" stroke="#a80"/><text x="510" y="9">перфоплата</text>
    <line x1="600" y1="5" x2="630" y2="5" stroke="#d9480f" stroke-width="3"/><text x="636" y="9">газ</text>
    <rect x="680" y="0" width="14" height="10" fill="none" stroke="#246" stroke-dasharray="4 3"/><text x="700" y="9">на крышке</text>
    <text x="0" y="30" fill="#555">Тракт: вход → змеевик → порт A → трубка → порт B → камера O2 (+BMP390) → SCD30 → ZE07 → выхлоп. Вход и выхлоп — на левой стенке.</text>
    <text x="0" y="46" fill="#555">Источник: docs/hardware/layout.md. Размеры ±5 мм до обмера реальных модулей.</text>
  </g>
</svg>
